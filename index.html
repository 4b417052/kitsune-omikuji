<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>狐火神籤 ｜ 夜之神社的每日一籤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Iansui&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f3e9d2; --red:#c8352a; --gold:#f1c453; --line:#8c2a25;
  --panel:rgba(18,12,32,.80);
  --brush:"Iansui","Kaiti TC","DFKai-SB","BiauKai","Noto Serif TC",serif;
  --cute:"Huninn","Iansui","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{overflow:hidden;background:#050816;color:var(--ink);font-family:var(--cute);font-size:18px}
button{font-family:inherit;color:inherit}
.brush{font-family:var(--brush)}

/* ---------- 背景 ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
   radial-gradient(ellipse at 50% 108%,rgba(120,30,50,.55) 0%,transparent 58%),
   linear-gradient(#04061a 0%,#0c1130 52%,#1e1740 100%)}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.95}}
.moon{position:absolute;top:8%;right:13%;width:118px;height:118px;border-radius:50%;
  background:radial-gradient(circle at 36% 34%,#fffbe8,#f3e3a8 58%,#cfb96f);
  box-shadow:0 0 70px 24px rgba(255,236,160,.22)}
.torii-bg{position:absolute;left:50%;bottom:-6px;width:min(560px,60vw);transform:translateX(-50%);opacity:.5;
  filter:drop-shadow(0 0 22px rgba(255,120,60,.45))}
.mist{position:absolute;left:-30%;width:160%;height:240px;bottom:-60px;border-radius:50%;
  background:radial-gradient(ellipse,rgba(200,210,255,.16),transparent 70%);filter:blur(18px);animation:mist 28s ease-in-out infinite alternate}
.mist.m2{bottom:-110px;animation-duration:38s;animation-direction:alternate-reverse;opacity:.8}
@keyframes mist{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
.lantern{position:absolute;top:-6px;width:92px;transform-origin:50% 0;animation:sway 5.5s ease-in-out infinite}
.lantern.l1{left:5%}.lantern.l2{right:5%;animation-delay:-2.6s}
.lantern svg{width:100%;height:auto;overflow:visible}
.lantern .glow{animation:flicker 2.3s infinite}
.lantern.l2 .glow{animation-duration:3.1s}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flicker{0%,100%{opacity:1}12%{opacity:.78}24%{opacity:.98}41%{opacity:.62}53%{opacity:.95}70%{opacity:.72}84%{opacity:1}}
.wisp{position:absolute;bottom:-40px;width:16px;height:26px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;
  background:radial-gradient(ellipse at 50% 70%,#e8f6ff 0%,#78bfff 45%,rgba(100,160,255,0) 72%);
  filter:blur(1px) drop-shadow(0 0 8px rgba(120,190,255,.9));opacity:0;animation:wisp 12s linear infinite}
@keyframes wisp{0%{transform:translate(0,0) scale(.7);opacity:0}12%{opacity:.8}50%{transform:translate(26px,-48vh) scale(1)}88%{opacity:.5}100%{transform:translate(-18px,-98vh) scale(.6);opacity:0}}
.ghost{position:absolute;opacity:0;pointer-events:none;filter:drop-shadow(0 0 10px rgba(255,190,110,.55));animation:ghost 2.5s ease-in-out forwards}
@keyframes ghost{0%{opacity:0;transform:scale(.8) rotate(-6deg)}35%{opacity:.30}60%{opacity:.16}100%{opacity:0;transform:scale(1.12) rotate(5deg)}}
.walker{position:absolute;bottom:7%;left:-120px;width:54px;height:150px;opacity:.0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 22%,#000 0 34%,transparent 36%),linear-gradient(#000,#000) 50% 100%/46px 108px no-repeat;
  border-radius:40% 40% 10% 10%;animation:walk 16s linear forwards}
.walker::before,.walker::after{content:"";position:absolute;top:26px;width:6px;height:6px;border-radius:50%;background:#ffd45a;box-shadow:0 0 8px #ffb52e}
.walker::before{left:15px}.walker::after{right:15px}
@keyframes walk{0%{left:-120px;opacity:0}8%{opacity:.5}92%{opacity:.5}100%{left:105%;opacity:0}}

/* ---------- 固定介面 ---------- */
.topbtn{position:fixed;top:18px;z-index:50;display:flex;align-items:center;gap:8px;
  background:rgba(20,12,30,.78);border:2px solid var(--line);color:var(--ink);padding:8px 18px;border-radius:999px;
  font-size:18px;cursor:pointer;transition:.2s;box-shadow:0 0 14px rgba(200,53,42,.25)}
.topbtn:hover{background:rgba(70,20,28,.9);box-shadow:0 0 20px rgba(255,150,60,.5)}
.topbtn svg{width:22px;height:22px}
#btnTL{left:20px}#btnSound{right:20px}
#btnSound.hint{animation:hint 1.8s ease-in-out infinite}
@keyframes hint{0%,100%{box-shadow:0 0 10px rgba(200,53,42,.3)}50%{box-shadow:0 0 26px 6px rgba(255,190,70,.85)}}
#trackToast{position:fixed;right:22px;top:68px;z-index:50;font-size:16px;color:var(--gold);opacity:0;transition:opacity .6s;pointer-events:none;letter-spacing:.08em;text-shadow:0 0 8px #000}
#trackToast.show{opacity:1}
.disclaimer{position:fixed;right:18px;bottom:12px;z-index:60;font-size:17px;letter-spacing:.2em;padding:4px 12px;
  color:var(--ink);opacity:.82;border:1px solid rgba(243,233,210,.38);border-radius:6px;background:rgba(10,8,20,.62);pointer-events:none}

/* ---------- 畫面 ---------- */
.screen{position:fixed;inset:0;z-index:10;display:none;overflow:auto;padding:86px 40px 64px}
.screen.active{display:flex;animation:fadeIn .55s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* 吉祥物 */
.fox{display:block;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(255,170,80,.35))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.bubble{position:relative;background:#fbf3df;color:#3a2222;border:3px solid #3a2222;border-radius:18px;padding:12px 18px;
  font-size:19px;line-height:1.5;max-width:300px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.bubble::after{content:"";position:absolute;left:46px;bottom:-16px;border:10px solid transparent;border-top:14px solid #3a2222}
.bubble::before{content:"";position:absolute;left:49px;bottom:-9px;border:7px solid transparent;border-top:10px solid #fbf3df;z-index:1}

/* 首頁 */
#home{align-items:center;justify-content:center;gap:56px}
#home .foxbox{display:flex;flex-direction:column;align-items:flex-start;gap:26px;margin-top:70px}
#home .foxbox .fox{width:230px;margin-left:30px}
#home .mainbox{display:flex;flex-direction:column;align-items:center}
.title{margin:0;font-size:78px;letter-spacing:.14em;font-weight:400;font-family:var(--brush);
  background:linear-gradient(#fff4c8,#f1c453 55%,#d9692b);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,120,50,.55)) drop-shadow(0 3px 0 #4a0f0c)}
.sub{margin:4px 0 22px;letter-spacing:.35em;font-size:17px;color:#d9c9a8;opacity:.9}
.card{width:520px;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:26px 34px 30px;
  box-shadow:0 0 0 6px rgba(20,12,30,.55),0 0 0 8px rgba(140,42,37,.55),0 16px 50px rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.field{margin-bottom:18px}
.field>label,.field>.lab{display:block;font-size:17px;color:var(--gold);margin-bottom:7px;letter-spacing:.2em}
input[type=text]{width:100%;background:#1b1530;border:2px solid #6e5a8a;color:var(--ink);font-size:20px;font-family:inherit;
  padding:10px 14px;border-radius:12px;outline:none;transition:.2s}
input[type=text]:focus{border-color:var(--gold);box-shadow:0 0 14px rgba(241,196,83,.4)}
input::placeholder{color:#7d7096}
.birth{display:flex;align-items:center;gap:8px}
.birth input{text-align:center;padding:10px 6px}
.birth .y{width:120px}.birth .m,.birth .d{width:78px}
.birth span{color:#d9c9a8}
.gender{display:flex;gap:14px;border-radius:14px}
.gender label{flex:1;margin:0;cursor:pointer;letter-spacing:0}
.gender input{position:absolute;opacity:0;pointer-events:none}
.gender span{display:block;text-align:center;font-size:20px;padding:10px;background:#1b1530;border:2px solid #6e5a8a;border-radius:12px;transition:.2s;color:var(--ink)}
.gender label:hover span{border-color:var(--gold)}
.gender input:checked+span{background:linear-gradient(#d9382b,#9c1f18);border-color:#ffb08a;box-shadow:0 0 16px rgba(255,90,60,.55)}
.flash{animation:flashRed .5s ease-in-out 2}
@keyframes flashRed{0%,100%{box-shadow:0 0 0 0 rgba(255,40,40,0);border-color:#ff2a2a}50%{box-shadow:0 0 0 4px #ff2a2a,0 0 20px 5px rgba(255,40,40,.95);border-color:#ff2a2a}}
.btn{display:inline-block;border:2px solid #ffb08a;background:linear-gradient(#e0443a,#a1221a);color:#fff4e0;font-size:22px;letter-spacing:.3em;
  padding:12px 30px;border-radius:999px;cursor:pointer;transition:.2s;box-shadow:0 5px 0 #5d0f0a,0 0 22px rgba(255,90,60,.4)}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 #5d0f0a,0 0 30px rgba(255,150,70,.7)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5d0f0a}
.btn.ghostbtn{background:rgba(30,22,52,.9);border-color:#8e7fb0;box-shadow:0 5px 0 #130c25;letter-spacing:.15em}
.btn.small{font-size:18px;padding:9px 24px;letter-spacing:.15em}
#btnStart{width:100%;margin-top:6px}

/* 彈出視窗 */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(3,4,12,.74)}
.modal.show{display:flex;animation:fadeIn .25s}
.dialog{width:min(480px,90vw);background:#fbf3df;color:#3a2222;border:4px solid #3a2222;border-radius:20px;padding:22px 28px 24px;text-align:center;
  box-shadow:0 0 0 6px #b5261c,0 20px 60px rgba(0,0,0,.7)}
.dialog .mfox{width:86px;height:auto;display:block;margin:-62px auto 4px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.mtitle{font-family:var(--brush);font-size:28px;color:#a1221a;margin-bottom:10px;letter-spacing:.1em}
.mbody{font-size:20px;line-height:1.8;text-align:left;margin-bottom:18px;word-break:break-all}
.mbody .row{display:flex;gap:10px;justify-content:center}
.mbody .row b{color:#a1221a;font-weight:400;min-width:4.2em;text-align:right}
.mbtns{display:flex;gap:14px;justify-content:center}
.mbtns .btn{font-size:19px;padding:9px 26px;letter-spacing:.15em}

/* 抽籤動畫 */
#drawing{padding:0;overflow:hidden}
#drawing .cap{position:absolute;top:9%;left:0;right:0;text-align:center;font-family:var(--brush);font-size:40px;letter-spacing:.3em;
  color:#ffe9b0;text-shadow:0 0 18px rgba(255,150,60,.8),0 3px 0 #4a0f0c}
#drawing .cap i{font-style:normal;animation:dots 1.4s steps(4,end) infinite;display:inline-block;width:2.2em;text-align:left;overflow:hidden;vertical-align:bottom}
@keyframes dots{0%{width:0}100%{width:2.2em}}
#drawing .stage{position:absolute;inset:0}
.tube-pos{position:absolute;left:50%;top:54%;width:230px;height:350px;margin:-175px 0 0 -115px;transition:opacity .5s}
.tube-wrap{width:100%;height:100%;transform-origin:50% 88%;transition:transform .5s ease;filter:drop-shadow(0 0 22px rgba(255,120,50,.45))}
.tube-wrap svg{width:100%;height:100%;overflow:visible}
.stage1 .tube-wrap{animation:shake .27s linear infinite}
@keyframes shake{0%{transform:rotate(-15deg) translateY(0)}25%{transform:rotate(9deg) translateY(-16px)}50%{transform:rotate(-9deg) translateY(0)}75%{transform:rotate(15deg) translateY(-16px)}100%{transform:rotate(-15deg) translateY(0)}}
.stage2 .tube-wrap{transform:rotate(-32deg) translateY(6px)}
.stage3 .tube-pos{opacity:0}
.stick{position:absolute;left:50%;top:54%;width:30px;height:290px;margin:-250px 0 0 -15px;opacity:0;border-radius:8px;
  background:linear-gradient(90deg,#b9803c,#f0c27a 40%,#d79c52 70%,#a46d2e);border:2px solid #6b4217;
  display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-family:var(--brush);font-size:20px;color:#8f1a12;letter-spacing:.1em;
  box-shadow:0 0 14px rgba(0,0,0,.5);transform-origin:50% 50%}
.stick::before{content:"";position:absolute;top:0;left:0;right:0;height:26px;background:#b5261c;border-radius:6px 6px 0 0}
.stage2 .stick{animation:stickOut 1.5s ease-in forwards}
@keyframes stickOut{
  0%{opacity:0;transform:translate(0,40px) rotate(0)}
  14%{opacity:1;transform:translate(8px,-34px) rotate(6deg)}
  52%{transform:translate(70px,0) rotate(36deg)}
  80%{transform:translate(150px,170px) rotate(80deg)}
  88%{transform:translate(152px,150px) rotate(76deg)}
  100%{opacity:1;transform:translate(152px,170px) rotate(80deg)}}
.stage3 .stick{animation:stickGone .45s forwards}
@keyframes stickGone{from{opacity:1;transform:translate(152px,170px) rotate(80deg)}to{opacity:0;transform:translate(152px,170px) rotate(80deg)}}
.paper-wrap{position:absolute;left:50%;top:54%;width:min(860px,86vw);aspect-ratio:1400/940;transform:translate(-50%,-50%);opacity:0}
.stage3 .paper-wrap{opacity:1}
.paper-wrap img{display:block;width:100%;height:100%;clip-path:inset(0 50% 0 50%);filter:drop-shadow(0 10px 30px rgba(0,0,0,.7))}
.stage3 .paper-wrap img{animation:unroll 1.3s ease-out forwards}
@keyframes unroll{from{clip-path:inset(0 50% 0 50%)}to{clip-path:inset(0 0 0 0)}}
.roll{position:absolute;top:-8px;bottom:-8px;width:20px;left:50%;margin-left:-10px;border-radius:10px;
  background:linear-gradient(90deg,#c9a56a,#f7ecd0 45%,#b98d4f);border:2px solid #7a5420;box-shadow:0 0 12px rgba(0,0,0,.5);opacity:0}
.stage3 .roll.r1{opacity:1;animation:rollL 1.3s ease-out forwards}
.stage3 .roll.r2{opacity:1;animation:rollR 1.3s ease-out forwards}
@keyframes rollL{from{left:50%}to{left:0}}
@keyframes rollR{from{left:50%}to{left:100%}}
#drawing .foxbox{position:absolute;left:5%;bottom:7%;display:flex;flex-direction:column;gap:22px}
#drawing .foxbox .fox{width:150px;margin-left:26px}

/* 結果 */
#result,#history{flex-direction:column;align-items:center}
#result{justify-content:center;gap:14px}
#result canvas,#hDetail canvas{max-width:min(1240px,92vw);max-height:calc(100vh - 168px);width:auto;height:auto;
  border-radius:6px;box-shadow:0 12px 50px rgba(0,0,0,.75),0 0 40px rgba(255,150,60,.18)}
#result .foxbox{position:fixed;left:16px;bottom:56px;display:none;flex-direction:column;gap:20px;z-index:20;pointer-events:none}
#result .foxbox .fox{width:120px;margin-left:22px}
#result .foxbox .bubble{font-size:16px;max-width:230px}
@media (min-width:1560px){#result .foxbox{display:flex}#result.active .foxbox{display:flex}}
.btnrow{display:flex;gap:16px;justify-content:center}

/* 歷史 */
#history{justify-content:flex-start;gap:14px}
#history h2{margin:0;font-family:var(--brush);font-weight:400;font-size:44px;letter-spacing:.3em;color:var(--gold);text-shadow:0 0 14px rgba(255,140,50,.6)}
#hList{width:min(860px,94vw);display:flex;flex-direction:column;gap:10px}
.hhead,.hitem{display:grid;grid-template-columns:130px 1.2fr 140px 60px 90px;gap:10px;align-items:center;padding:0 22px}
.hhead{font-size:15px;color:#bfae8f;letter-spacing:.2em}
.hitem{height:60px;background:var(--panel);border:2px solid var(--line);border-radius:14px;cursor:pointer;font-size:19px;text-align:left;transition:.2s}
.hitem:hover{border-color:var(--gold);transform:translateX(4px);box-shadow:0 0 18px rgba(255,170,60,.4)}
.hitem .hname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hlevel{justify-self:end;text-align:center;border-radius:999px;padding:3px 0;width:78px;font-family:var(--brush);font-size:20px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.45)}
.empty{text-align:center;margin-top:40px;font-size:22px;color:#d9c9a8;line-height:2}
.empty .fox{width:130px;margin:0 auto 16px}
#hDetail{display:none;flex-direction:column;align-items:center;gap:14px}
#hDetail canvas{max-height:calc(100vh - 220px)}
.tipline{font-size:15px;color:#bfae8f;letter-spacing:.1em}
@media (max-width:1100px){#home{flex-direction:column;gap:10px}#home .foxbox{flex-direction:row;margin-top:20px}#home .foxbox .fox{width:120px}.card{width:min(520px,94vw)}.title{font-size:56px}}
</style>
</head>
<body>

<!-- 共用圖形（狐狸小神使） -->
<svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>

<div id="bg" aria-hidden="true">
  <div class="moon"></div>
  <svg class="torii-bg" viewBox="0 0 400 300">
    <path d="M10 44 Q200 8 390 44 L380 68 Q200 38 20 68Z" fill="#6e1014"/>
    <path d="M52 96 H348 V114 H52Z" fill="#6e1014"/>
    <path d="M84 62 H108 V300 H84Z M292 62 H316 V300 H292Z" fill="#6e1014"/>
    <path d="M178 66 H222 V98 H178Z" fill="#3a0a0c"/>
  </svg>
  <div class="mist"></div><div class="mist m2"></div>
  <div class="lantern l1"><svg viewBox="0 0 92 190">
    <line x1="46" y1="0" x2="46" y2="36" stroke="#2a1a1a" stroke-width="3"/>
    <g class="glow"><ellipse cx="46" cy="102" rx="70" ry="78" fill="url(#lg)" opacity=".55"/></g>
    <rect x="30" y="34" width="32" height="10" rx="3" fill="#2a1a1a"/>
    <ellipse cx="46" cy="94" rx="36" ry="48" fill="#d9382b" stroke="#5d0f0a" stroke-width="3"/>
    <path d="M46 46 V142 M28 52 Q20 94 28 138 M64 52 Q72 94 64 138 M36 48 Q31 94 36 142 M56 48 Q61 94 56 142" stroke="#7a1810" stroke-width="2" fill="none" opacity=".7"/>
    <rect x="30" y="140" width="32" height="10" rx="3" fill="#2a1a1a"/>
    <text x="46" y="106" font-size="30" text-anchor="middle" fill="#ffe9b0" style="font-family:var(--brush)">火</text>
    <path d="M46 150 V176 M40 176 H52 M42 176 L40 190 M46 176 V190 M50 176 L52 190" stroke="#e8b23a" stroke-width="2" fill="none"/>
  </svg></div>
  <div class="lantern l2"><svg viewBox="0 0 92 190">
    <line x1="46" y1="0" x2="46" y2="36" stroke="#2a1a1a" stroke-width="3"/>
    <g class="glow"><ellipse cx="46" cy="102" rx="70" ry="78" fill="url(#lg)" opacity=".55"/></g>
    <rect x="30" y="34" width="32" height="10" rx="3" fill="#2a1a1a"/>
    <ellipse cx="46" cy="94" rx="36" ry="48" fill="#d9382b" stroke="#5d0f0a" stroke-width="3"/>
    <path d="M46 46 V142 M28 52 Q20 94 28 138 M64 52 Q72 94 64 138 M36 48 Q31 94 36 142 M56 48 Q61 94 56 142" stroke="#7a1810" stroke-width="2" fill="none" opacity=".7"/>
    <rect x="30" y="140" width="32" height="10" rx="3" fill="#2a1a1a"/>
    <text x="46" y="106" font-size="30" text-anchor="middle" fill="#ffe9b0" style="font-family:var(--brush)">籤</text>
    <path d="M46 150 V176 M40 176 H52 M42 176 L40 190 M46 176 V190 M50 176 L52 190" stroke="#e8b23a" stroke-width="2" fill="none"/>
  </svg></div>
  <svg width="0" height="0" style="position:absolute"><defs><radialGradient id="lg"><stop offset="0" stop-color="#ffb347" stop-opacity=".95"/><stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/></radialGradient></defs></svg>
</div>

<button id="btnTL" class="topbtn" type="button"></button>
<button id="btnSound" class="topbtn hint" type="button" aria-label="音樂開關"></button>
<div id="trackToast"></div>
<div class="disclaimer">僅供娛樂</div>

<!-- 首頁 -->
<section id="home" class="screen active">
  <div class="foxbox">
    <div class="bubble" id="homeBubble">請報上名來……</div>
    <svg class="fox" viewBox="0 0 140 145"><use href="#fox"/></svg>
  </div>
  <div class="mainbox">
    <h1 class="title">狐火神籤</h1>
    <p class="sub">夜之神社的每日一籤</p>
    <div class="card">
      <div class="field">
        <label for="inName">姓　名</label>
        <input type="text" id="inName" maxlength="12" placeholder="請輸入你的名字" autocomplete="off">
      </div>
      <div class="field">
        <div class="lab">生　日（西元）</div>
        <div class="birth">
          <input type="text" id="inY" class="y" inputmode="numeric" maxlength="4" placeholder="1999" autocomplete="off"><span>年</span>
          <input type="text" id="inM" class="m" inputmode="numeric" maxlength="2" placeholder="12" autocomplete="off"><span>月</span>
          <input type="text" id="inD" class="d" inputmode="numeric" maxlength="2" placeholder="25" autocomplete="off"><span>日</span>
        </div>
      </div>
      <div class="field">
        <div class="lab">性　別</div>
        <div class="gender" id="inGender">
          <label><input type="radio" name="gender" value="男"><span>男</span></label>
          <label><input type="radio" name="gender" value="女"><span>女</span></label>

/* =====================================================================
   抽籤運算（姓名＋生日＋性別＋日期 → 固定結果）
   ===================================================================== */
function makeKey(inp,date){return `${inp.name}|${inp.y}-${inp.m}-${inp.d}|${inp.gender}|${date}`;}
function generateFortune(inp,date){
  const key=makeKey(inp,date);
  const r=makeRng(key);
  const level=LEVELS[Math.floor(r()*LEVELS.length)];
  const num=1+Math.floor(r()*100);
  const poem=pick(POEMS[level.key],r);
  const [lo,hi]=STAR_RANGE[level.key];
  const stars={};
  SUBS.forEach(s=>{stars[s.k]=lo+Math.floor(r()*(hi-lo+1));});
  const vals=SUBS.map(s=>stars[s.k]);
  if(hi>lo&&vals.every(v=>v===vals[0])){ // 避免四項完全一樣
    const s=SUBS[Math.floor(r()*4)].k; stars[s]=stars[s]>=hi?stars[s]-1:stars[s]+1;
  }
  const it=ITEMS[level.key],items={};
  ITEM_LABELS.forEach(x=>{items[x.k]=pick(it[x.k],r);});
  const color=pick(COLORS,r);
  const luckyNum=1+Math.floor(r()*99);
  const cat=CATS[Math.floor(r()*CATS.length)];
  const pool=CHARMS.filter(c=>c.c===cat&&(c.g==='*'||c.g===inp.gender));
  const charm=pick(pool,r);
  const advice=pick(ADVICE[level.key],r);
  const title=inp.name+(inp.gender==='男'?'君':'小姐');
  // 白話解釋（與整體運勢、分項分數一致）
  const arr=SUBS.map(s=>({n:s.n,v:stars[s.k]}));
  const best=arr.reduce((a,b)=>b.v>a.v?b:a), worst=arr.reduce((a,b)=>b.v<a.v?b:a);
  let stat='';
  if(best.v!==worst.v){
    stat=(level.key==='suekichi'||level.key==='kyo')
      ?`四項之中「${best.n}」相對較好，「${worst.n}」要特別小心。`
      :`四項之中以「${best.n}」最旺，「${worst.n}」宜稍加留意。`;
  }
  return {key,name:inp.name,gender:inp.gender,y:inp.y,m:inp.m,d:inp.d,date,title,
    level:{key:level.key,name:level.name,color:level.color},num,poem:poem.l,
    explain:poem.p+stat+advice,explainShort:poem.p+advice,
    stars,items,color,luckyNum,charm:{cat,emoji:charm.e,name:charm.n,desc:charm.d}};
}

function wrapText(c,text,maxW){
  const lines=[];let line='';const punct='，。、！？；：」』）…';
  for(const ch of text){
    const t=line+ch;
    if(c.measureText(t).width>maxW&&line&&!punct.includes(ch)){lines.push(line);line=ch;}else line=t;
  }
  if(line)lines.push(line);return lines;
}

    const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter(),g2=ctx.createGain();
    o.type='triangle';o2.type='sine';
    o.frequency.setValueAtTime(f*1.014,t);o.frequency.exponentialRampToValueAtTime(f,t+.06);o2.frequency.value=f*2;g2.gain.value=.25;
    lp.type='lowpass';lp.frequency.setValueAtTime(4200,t);lp.frequency.exponentialRampToValueAtTime(900,t+1.3);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.24*v,t+.004);g.gain.exponentialRampToValueAtTime(.0008,t+2);
    o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(bus);
    o.start(t);o2.start(t);o.stop(t+2.1);o2.stop(t+2.1);
  }
  function shaku(t,f,dur,v,gl){
    const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
    o.type='triangle';
    if(gl){o.frequency.setValueAtTime(f*1.06,t);o.frequency.exponentialRampToValueAtTime(f,t+.7);}else o.frequency.value=f;
    const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=5;lg.gain.value=f*.012;lfo.connect(lg);lg.connect(o.frequency);
    lp.type='lowpass';lp.frequency.value=2000;
    const n=ctx.createBufferSource();n.buffer=noiseBuf;n.loop=true;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f*2;bp.Q.value=2.5;
    const ng=ctx.createGain();ng.gain.setValueAtTime(.0001,t);ng.gain.linearRampToValueAtTime(.05*v,t+.4);ng.gain.linearRampToValueAtTime(.0001,t+dur);
    n.connect(bp);bp.connect(ng);ng.connect(bus);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.16*v,t+.45);g.gain.setValueAtTime(.16*v,t+dur*.65);g.gain.linearRampToValueAtTime(.0001,t+dur);
    o.connect(lp);lp.connect(g);g.connect(bus);
    o.start(t);lfo.start(t);n.start(t);o.stop(t+dur+.1);lfo.stop(t+dur+.1);n.stop(t+dur+.1);
  }
  function shami(t,f,v){
    const o=ctx.createOscillator(),g=ctx.createGain(),bp=ctx.createBiquadFilter();
    o.type='sawtooth';o.frequency.setValueAtTime(f*1.03,t);o.frequency.exponentialRampToValueAtTime(f,t+.03);
    bp.type='bandpass';bp.frequency.value=1300;bp.Q.value=2.4;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.20*v,t+.003);g.gain.exponentialRampToValueAtTime(.0008,t+.34);
    o.connect(bp);bp.connect(g);g.connect(bus);o.start(t);o.stop(t+.4);
    const n=ctx.createBufferSource();n.buffer=noiseBuf;const ng=ctx.createGain();
    ng.gain.setValueAtTime(.12*v,t);ng.gain.exponentialRampToValueAtTime(.0005,t+.04);
    const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=2500;n.connect(hp);hp.connect(ng);ng.connect(bus);n.start(t);n.stop(t+.06);
  }
  function taiko(t,v){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(42,t+.35);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.55*v,t+.005);g.gain.exponentialRampToValueAtTime(.001,t+.7);
    o.connect(g);g.connect(bus);o.start(t);o.stop(t+.8);
    const n=ctx.createBufferSource();n.buffer=noiseBuf;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;
    const ng=ctx.createGain();ng.gain.setValueAtTime(.25*v,t);ng.gain.exponentialRampToValueAtTime(.001,t+.12);
    n.connect(lp);lp.connect(ng);ng.connect(bus);n.start(t);n.stop(t+.15);
  }
  function bell(t,f,v){
    [[1,1],[2.76,.45],[5.4,.22]].forEach(([k,a])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f*k;
      g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.07*v*a,t+.004);g.gain.exponentialRampToValueAtTime(.0004,t+2.6/k+.6);
      o.connect(g);g.connect(bus);o.start(t);o.stop(t+3.4);
    });
  }
  function play(e,t){
    const f=mf(e.m||60);
    switch(e.type){
      case'koto':koto(t,f,e.v);break;
      case'shaku':shaku(t,f,e.d*spb,e.v,e.gl);break;
      case'shami':shami(t,f,e.v);break;
      case'taiko':taiko(t,e.v);break;
      case'bell':bell(t,f,e.v);break;
    }
  }
  /* ---- 作曲（每首固定種子，所以每次聽到一樣） ---- */
  function genTrack(i,cfg){
    const r=mulberry32(1000+i*7717),sc=SCALES[cfg.scale];
    const note=d=>cfg.root+12*Math.floor(d/5)+sc[((d%5)+5)%5];
    const ev=[];
    const mk=()=>{let d=5+Math.floor(r()*3);const m=[];
      for(let s=0;s<16;s++){
        if(r()<cfg.koto){d=Math.max(2,Math.min(10,d+[-2,-1,-1,0,1,1,2][Math.floor(r()*7)]));m.push(d);}else m.push(null);
      }return m;};
    const A=mk(),B=mk();
    const mut=m=>m.map(x=>r()<.2?(x===null?(r()<.5?5+Math.floor(r()*4):null):x+(r()<.5?-1:1)):x);
    const blocks=[A,mut(A),B,A,mut(A),mut(B),A,mut(A)];
    blocks.forEach((m,bi)=>m.forEach((d,si)=>{if(d!==null)ev.push({t:bi*8+si*.5,type:'koto',m:note(d),v:.5+r()*.3});}));
    for(let b=0;b<LOOP;b+=8){ev.push({t:b,type:'koto',m:note(-5),v:.75});ev.push({t:b+4,type:'koto',m:note(-2),v:.55});}
    if(cfg.shaku){
      for(let b=0;b<LOOP;b+=16){
        const d1=[0,2,3,4,5][Math.floor(r()*5)],d2=[0,2,3,5][Math.floor(r()*4)];
        ev.push({t:b+(b%32?1:0),type:'shaku',m:note(d1),d:6,v:.9,gl:cfg.gl});
        ev.push({t:b+8,type:'shaku',m:note(d2),d:3.5,v:.8,gl:cfg.gl});
      }
    }
    if(cfg.shami){
      const pat=[1,0,1,1,0,1,0,0];
      for(let bar=0;bar<16;bar++)pat.forEach((h,s)=>{
        if(h&&r()<.78)ev.push({t:bar*4+s*.5,type:'shami',m:note([0,3,2,0][Math.floor(r()*4)])+12,v:.45+r()*.2});
      });
    }
    if(cfg.taiko){
      for(let bar=0;bar<16;bar++){
        ev.push({t:bar*4,type:'taiko',v:1});
        if(cfg.taiko===2)ev.push({t:bar*4+.45,type:'taiko',v:.55});
        else if(r()<.5)ev.push({t:bar*4+2.5,type:'taiko',v:.5});
      }
    }
    for(let seg=0;seg<LOOP;seg+=16)for(let k=0;k<cfg.bells;k++){
      const t=seg+r()*15.5,m=note(10+Math.floor(r()*5));
      ev.push({t,type:'bell',m,v:.5+r()*.4});
      if(cfg.eerie&&r()<.4)ev.push({t:t+.02,type:'bell',m:m+1,v:.35});
    }
    ev.sort((a,b)=>a.t-b.t);return ev;
  }
  function begin(i,start){
    const cfg=TRACKS[i];events=genTrack(i,cfg);spb=60/cfg.bpm;t0=start;eIdx=0;
    const wait=Math.max(0,(start-ctx.currentTime)*1000);
    setTimeout(()=>{if(Snd.onTrack&&on)Snd.onTrack(cfg.name);},wait);
  }
  function tick(){
    if(!ctx||!on)return;
    const horizon=ctx.currentTime+.4;
    while(eIdx<events.length){
      const e=events[eIdx],at=t0+e.t*spb;
      if(at>horizon)break;
      if(at>=ctx.currentTime-.05)play(e,at);
      eIdx++;
    }
    if(eIdx>=events.length){
      const end=t0+LOOP*spb;
      if(end<horizon+.05){tIdx=(tIdx+1)%TRACKS.length;begin(tIdx,end);}
    }
  }
  async function start(){
    if(on)return;
    if(!ctx)init();
    try{await ctx.resume();}catch(e){}
    on=true;
    master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(.6,ctx.currentTime,.05);
    begin(tIdx,ctx.currentTime+.2);
    timer=setInterval(tick,100);
  }
  function stop(){
    if(!on)return;
    on=false;clearInterval(timer);timer=null;
    const c=ctx;ctx=null;
    try{c.currentTime;master.gain.cancelScheduledValues(c.currentTime);master.gain.setTargetAtTime(0,c.currentTime,.04);}catch(e){}
    setTimeout(()=>{try{c.close();}catch(e){}},300);
  }
  /* ---- 抽籤音效 ---- */
  function clack(t,v){
    const o=ctx.createOscillator(),g=ctx.createGain(),f=650+Math.random()*600;
    o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.55,t+.06);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.4*v,t+.002);g.gain.exponentialRampToValueAtTime(.0005,t+.09);
    o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+.12);
    const n=ctx.createBufferSource();n.buffer=noiseBuf;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3000;bp.Q.value=.8;
    const ng=ctx.createGain();ng.gain.setValueAtTime(.3*v,t);ng.gain.exponentialRampToValueAtTime(.0005,t+.05);
    n.connect(bp);bp.connect(ng);ng.connect(sfxBus);n.start(t,Math.random()*.5);n.stop(t+.08);
  }
  function swish(t,dur,f0,f1,v){
    const n=ctx.createBufferSource();n.buffer=noiseBuf;n.loop=true;
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.2;bp.frequency.setValueAtTime(f0,t);bp.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.28*v,t+dur*.35);g.gain.linearRampToValueAtTime(.0001,t+dur);
    n.connect(bp);bp.connect(g);g.connect(sfxBus);n.start(t);n.stop(t+dur+.05);
  }
  return {
    get on(){return on;},
    start,stop,onTrack:null,
    shake(){if(!on||!ctx)return;const t=ctx.currentTime+.05;let x=0;let i=0;while(x<1.95){clack(t+x,.7+Math.random()*.3);swish(t+x,.1,2000,4500,.6);x+=.13+Math.random()*.06;if(++i>40)break;}},
    drop(delay){if(!on||!ctx)return;const t=ctx.currentTime+delay;clack(t,.9);clack(t+.14,.6);clack(t+.24,.35);},
    unroll(delay){if(!on||!ctx)return;swish(ctx.currentTime+delay,1.0,1400,5200,1);},
    reveal(delay){if(!on||!ctx)return;bell(ctx.currentTime+delay,mf(88),1.2);bell(ctx.currentTime+delay+.18,mf(93),.9);},
    _tracks:TRACKS,_gen:genTrack
  };
})();

/* =====================================================================
   歷史紀錄（localStorage）
   ===================================================================== */
const LS_KEY='kitsune-omikuji-history-v1';
let memHist=[];
function loadHistory(){
  try{const a=JSON.parse(localStorage.getItem(LS_KEY)||'[]');return Array.isArray(a)?a:memHist;}catch(e){return memHist;}
}
function saveHistory(a){memHist=a;try{localStorage.setItem(LS_KEY,JSON.stringify(a));}catch(e){}}
function recordDraw(R){
  const h=loadHistory();
  const ex=h.find(x=>x.key===R.key);
  if(ex)return {result:ex.result,isNew:false};
  h.unshift({key:R.key,ts:Date.now(),result:R});
  saveHistory(h.slice(0,7));
  return {result:R,isNew:true};
}

['inY','inM','inD'].forEach(id=>$(id).addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'');}));
function readForm(){
  const genderEl=document.querySelector('input[name=gender]:checked');
  return {name:el.name.value.trim().replace(/\s+/g,' '),ys:el.y.value,ms:el.m.value,ds:el.d.value,gender:genderEl?genderEl.value:''};
}
function validate(v){
  const errs=[];
  if(!v.name)errs.push({els:[el.name],msg:'還沒有填寫姓名喔'});
  const missing=[];
  if(!v.ys)missing.push(['年',el.y]);if(!v.ms)missing.push(['月',el.m]);if(!v.ds)missing.push(['日',el.d]);
  if(missing.length){
    errs.push({els:missing.map(x=>x[1]),msg:'生日還沒填完整（缺少：'+missing.map(x=>x[0]).join('、')+'）'});
  }else{
    const y=+v.ys,m=+v.ms,d=+v.ds,now=new Date(),thisY=now.getFullYear();
    if(y>thisY&&v.ys.length===4)errs.push({els:[el.y,el.m,el.d],msg:'生日不能是未來的日期喔'});
    else if(v.ys.length<4||y<1900)errs.push({els:[el.y],msg:`年份請填 1900 年以後的 4 位數西元年`});
    else if(m<1||m>12)errs.push({els:[el.m],msg:'月份請填 1 到 12'});
    else if(d<1||d>31)errs.push({els:[el.d],msg:'日期請填 1 到 31'});
    else{
      const dt=new Date(y,m-1,d);
      if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)errs.push({els:[el.y,el.m,el.d],msg:'這個日期不存在，請再確認一下'});
      else if(dt>new Date(thisY,now.getMonth(),now.getDate()))errs.push({els:[el.y,el.m,el.d],msg:'生日不能是未來的日期喔'});
    }
  }
  if(!v.gender)errs.push({els:[el.gender],msg:'請選擇性別'});
  return errs;
}
function flash(errs){
  const list=[];errs.forEach(e=>e.els.forEach(x=>{if(!list.includes(x))list.push(x);}));
  list.forEach(x=>{
    x.classList.remove('flash');void x.offsetWidth;x.classList.add('flash');
    x.addEventListener('animationend',()=>x.classList.remove('flash'),{once:true});
  });
  const first=list[0];if(first&&first.focus&&first!==el.gender)first.focus();
}

/* 抽籤動畫 */
async function startDraw(inp){
  busy=true;
  const date=todayStr();
  const fresh=generateFortune(inp,date);
  const {result:R,isNew}=recordDraw(fresh);
  curResult=R;
  show('drawing');
  const stage=$('stage');stage.className='stage';
  const stick=$('stick');stick.textContent='第'+kanji(R.num)+'番';
  $('paperImg').removeAttribute('src');
  const paperReady=renderPaper($('resultCanvas'),R).then(()=>{$('paperImg').src=$('resultCanvas').toDataURL('image/png');}).catch(()=>{});
  const say=t=>{$('drawBubble').textContent=t;};
  say(isNew?'神明感應中……請在心裡默念願望喔。':'今天已經抽過這支籤了……神明的答覆不會變喔。');
  // 階段一：搖籤筒
  void stage.offsetWidth;stage.classList.add('stage1');Snd.shake();
  await sleep(2000);
  // 階段二：籤棒掉出
  stage.classList.remove('stage1');stage.classList.add('stage2');say('有東西掉出來了……！');Snd.drop(.95);
  await sleep(1500);
  // 階段三：籤紙展開
  await paperReady;
  stage.classList.add('stage3');say('神明回應了。');Snd.unroll(.05);Snd.reveal(1.1);
  await sleep(1550);
  showResult(R);
  busy=false;
}

  curResult=R;
  $('resultBubble').textContent=FOX_SAY[R.level.key];
  show('result');
}

function initBackground(){

  for(let i=0;i<90;i++){
    const s=document.createElement('div');s.className='star';
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*72}%;animation-delay:${(Math.random()*3).toFixed(2)}s;animation-duration:${(2+Math.random()*3).toFixed(2)}s;transform:scale(${(.6+Math.random()*1.2).toFixed(2)})`;
    bg.appendChild(s);
  }
  for(let i=0;i<14;i++){
    const w=document.createElement('div');w.className='wisp';
    w.style.cssText=`left:${(4+Math.random()*92).toFixed(1)}%;animation-duration:${(10+Math.random()*9).toFixed(1)}s;animation-delay:${(-Math.random()*16).toFixed(1)}s`;
    bg.appendChild(w);
  }
  const ghost=()=>{
    if(!document.hidden){
      const g=document.createElement('div');g.className='ghost';
      const sz=56+Math.random()*70;
      g.style.cssText=`left:${(4+Math.random()*86).toFixed(1)}%;top:${(10+Math.random()*60).toFixed(1)}%;width:${sz.toFixed(0)}px;height:${(sz*.77).toFixed(0)}px`;
      g.innerHTML='<svg viewBox="0 0 120 92" width="100%" height="100%"><use href="#foxhead"/></svg>';
      bg.appendChild(g);setTimeout(()=>g.remove(),2700);
    }
    setTimeout(ghost,7000+Math.random()*9000);
  };
  setTimeout(ghost,5000);
  const walker=()=>{
    if(!document.hidden){const w=document.createElement('div');w.className='walker';bg.appendChild(w);setTimeout(()=>w.remove(),16500);}
    setTimeout(walker,38000+Math.random()*30000);
  };
  setTimeout(walker,20000);
}

/* 初始化 */
buildDefs();
initBackground();
renderSoundBtn();
setTL('history');
</script>
</body>
</html>
